name: Inspect mkdtboimg.py for Python 2-isms

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Kernel repo URL'
        required: true
        default: 'https://github.com/GhaintBadhan/kernel_xiaomi_kangx'
      ref:
        description: 'Branch or tag to inspect'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PATTERN: 'print [^(]|xrange|iteritems|unicode\(|raw_input|basestring'

    steps:
      - name: Clone kernel source (depth=1)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repo }}" kernel_xiaomi_kangx
          cd kernel_xiaomi_kangx
          {
            echo "## mkdtboimg.py Python-2-ism check"
            echo "- Repo: \`${{ inputs.repo }}\`"
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- HEAD: \`$(git log -1 --oneline)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: head -n 5 + grep py2-isms
        run: |
          set -uo pipefail
          cd kernel_xiaomi_kangx

          SCRIPT="scripts/mkdtboimg.py"

          if [ ! -f "$SCRIPT" ]; then
            {
              echo ""
              echo "### \`$SCRIPT\`"
              echo '```'
              echo "(file not found)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HEAD_OUT="$(head -n 5 "$SCRIPT")"
          GREP_OUT="$(grep -nE "$PATTERN" "$SCRIPT" 2>/dev/null || true)"
          [ -z "$GREP_OUT" ] && GREP_OUT="(no Python-2-ism hits — likely Python 3 compatible)"

          {
            echo ""
            echo "### Shebang / first lines"
            echo '```'
            echo "$HEAD_OUT"
            echo '```'
            echo ""
            echo "### grep -nE \`$PATTERN\`"
            echo '```'
            echo "$GREP_OUT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
