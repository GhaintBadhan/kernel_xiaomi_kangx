name: Stable 3-way merge
on:
  workflow_dispatch:
    inputs:
      from:
        description: Upstream version your tree is based on
        default: "v5.4.234"
      to:
        description: Version to merge up to
        default: "v5.4.249"
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch upstream and merge
        run: |
          git config user.name "stable-merge"
          git config user.email "stable-merge@users.noreply.github.com"
          MAINSHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse "HEAD^{tree}")
          U=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          N=${FROM##*.}
          EX=${FROM%.*}.$((N-1))
          git fetch --no-tags --shallow-exclude=$EX $U tag $FROM tag $TO \
            || git fetch --no-tags $U linux-5.4.y tag $FROM tag $TO
          SYN=$(git commit-tree "$TREE" -p "${FROM}^{commit}" -m "Kangaroo tree on $FROM base")
          git checkout -q -b stable-merge "$SYN"
          TOSHA=$(git rev-parse "${TO}^{commit}")
          if git merge --no-edit -m "Merge $TO" "$TOSHA"; then
            echo "Clean merge" >> $GITHUB_STEP_SUMMARY
          else
            echo "Conflicted files:" >> $GITHUB_STEP_SUMMARY
            git diff --name-only --diff-filter=U >> $GITHUB_STEP_SUMMARY
            git add -A
            git commit -q -m "Merge $TO (conflict markers left in files)"
          fi
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile >> $GITHUB_STEP_SUMMARY
          FINAL=$(git commit-tree "HEAD^{tree}" -p "$MAINSHA" -m "Stable merge $FROM..$TO")
          git push origin "$FINAL:refs/heads/stable-merge" --force
